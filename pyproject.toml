[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsim"
version = "0.1.0"
description = "Discrete-event simulator and cost model for LLM agent workloads: how many concurrent agents a serving cluster sustains, what synchronization points cost, and which scheduler wins."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Maria (Anh Duong Vo)" }]
keywords = ["agents", "llm-serving", "simulation", "scheduling", "cost-model", "vllm", "benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "pydantic>=2.5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff==0.16.10", "matplotlib>=3.8"]

[project.scripts]
agentsim = "agentsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.pytest.ini_options]
testpaths = ["tests"]
